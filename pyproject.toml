[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundtruth-mcp"
# Single-sourced from groundtruth_mcp.__version__ (see [tool.hatch.version]).
# Two copies of a version number is one copy too many: the one you forget to
# bump is always the one someone reads.
dynamic = ["version"]
description = "Expose your project's own lint / replay / simulate / query capabilities to coding agents as MCP tools, so the agent gets real feedback instead of guessing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ZhenGtai123" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "developer-tools", "simulation", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# The core — rule engine, seeded simulation, statistics, thresholds, SQL guard,
# CLI — has zero third-party dependencies. That is deliberate: the CI gate must
# not depend on the agent stack. `pip install groundtruth-mcp` gets you a
# working `groundtruth simulate --gate` on a bare runner; the MCP SDK is only
# needed by whoever actually serves the tools to an agent.
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/ZhenGtai123/groundtruth-mcp"
Documentation = "https://github.com/ZhenGtai123/groundtruth-mcp#readme"
Issues = "https://github.com/ZhenGtai123/groundtruth-mcp/issues"
Changelog = "https://github.com/ZhenGtai123/groundtruth-mcp/blob/main/CHANGELOG.md"

[project.scripts]
groundtruth = "groundtruth_mcp.cli:main"

[tool.hatch.version]
path = "src/groundtruth_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/groundtruth_mcp"]

[tool.hatch.build.targets.sdist]
# The sdist carries everything needed to verify the package from source: the
# tests, the runnable example, and the CI that gates them. A source
# distribution you cannot test is a tarball.
include = [
    "/src",
    "/tests",
    "/examples",
    "/scripts",
    "/docs",
    "/.github/workflows",
    "/README.md",
    "/README.zh-CN.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples/checkout-flow"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples/checkout-flow"]

[tool.ruff.lint]
# BLE is in the list on purpose: this package catches broad exceptions in a few
# places (user code crossing the toolkit boundary, a database refusing a
# query), and each one carries an explicit `# noqa: BLE001` next to the reason.
# Selecting the rule is what keeps those annotations honest — remove the
# justification and the lint comes back.
select = ["E", "F", "W", "I", "B", "BLE", "C4", "RET", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test callbacks take the full capability signature whether or not a given test
# body uses every argument; that is the contract, not an oversight.
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
files = ["src/groundtruth_mcp"]
ignore_missing_imports = true      # the MCP SDK and psycopg are optional extras
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["groundtruth_mcp"]

[tool.coverage.report]
# 75, not 90: the PostgreSQL source cannot be exercised without a live server,
# and mocking a database to inflate a percentage would test the mock. What it
# does guarantee is that the rule engine, statistics, guard and toolkit stay
# covered — the parts a regression would actually reach.
fail_under = 75
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
